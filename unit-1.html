<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zuzanna Koziatek | Unit 1</title>
  <style>
    :root {
      --purple: #6d28d9;
      --dark-purple: #4c1d95;
      --light-purple: #f5f3ff;
      --text: #241b35;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      color: var(--text);
      font-family: Arial, sans-serif;
      line-height: 1.6;
    }

    header {
      background: linear-gradient(135deg, var(--purple), var(--dark-purple));
      color: white;
      padding: 1rem 8%;
    }

    nav {
      align-items: center;
      display: flex;
      justify-content: space-between;
      margin: 0 auto;
      max-width: 1100px;
    }

    .logo {
      color: white;
      font-size: 1.1rem;
      font-weight: bold;
      letter-spacing: 0.04em;
      text-decoration: none;
    }

    nav ul {
      display: flex;
      gap: 1.5rem;
      list-style: none;
    }

    nav a {
      color: white;
      text-decoration: none;
    }

    nav a:hover,
    nav a:focus {
      text-decoration: underline;
    }

    .hero {
      padding: 6rem 8%;
      text-align: center;
    }

    .hero h1 {
      font-size: clamp(2.5rem, 7vw, 4.5rem);
      margin-bottom: 0.5rem;
    }

    .hero p {
      font-size: clamp(1.1rem, 2vw, 1.4rem);
      opacity: 0.9;
    }

    main {
      background: var(--light-purple);
      min-height: 300px;
      padding: 4rem 8%;
    }

    .content {
      margin: 0 auto;
      max-width: 800px;
      text-align: center;
    }

    .content h2 {
      color: var(--dark-purple);
      margin-bottom: 1rem;
    }

    .blog-post {
      background: white;
      border-radius: 0.5rem;
      margin-top: 3rem;
      padding: 2rem;
      text-align: left;
    }

    .blog-post h2 {
      color: var(--dark-purple);
      margin-bottom: 1.5rem;
      text-align: center;
    }

    .image-gallery {
      display: grid;
      gap: 1rem;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      margin-bottom: 2rem;
    }

    .image-gallery a {
      display: block;
    }

    .image-gallery img {
      border: 3px solid transparent;
      border-radius: 0.5rem;
      display: block;
      height: 240px;
      object-fit: cover;
      transition: transform 0.2s ease, border-color 0.2s ease;
      width: 100%;
    }

    .image-gallery img:hover,
    .image-gallery img:focus {
      border-color: var(--purple);
      transform: scale(1.03);
    }

    .image-caption {
      color: #5b5268;
      font-size: 0.9rem;
      margin-top: 0.4rem;
      text-align: center;
    }

    .paragraph-space {
      border-bottom: 1px solid #ddd6fe;
      min-height: 4rem;
    }

    footer {
      background: var(--dark-purple);
      color: white;
      padding: 1rem;
      text-align: center;
    }

    @media (max-width: 600px) {
      nav {
        align-items: flex-start;
        flex-direction: column;
        gap: 0.75rem;
      }

      .image-gallery {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <header>
    <nav aria-label="Main navigation">
      <a class="logo" href="index.html#about">Zuzanna Koziatek</a>
      <ul>
        <li><a href="index.html#about">About</a></li>
        <li><a href="unit-1.html" aria-current="page">Unit 1</a></li>
      </ul>
    </nav>

    <section class="hero" aria-labelledby="page-title">
      <h1 id="page-title">Unit 1 Lens-Based Analysis Essay</h1>
      <p>Writing Process Archive</p>
    </section>
  </header>

  <main>
    <section class="content" aria-labelledby="unit-title">
      <h2 id="unit-title">Unit 1</h2>
      <p>This page archives the writing process for the Unit 1 Lens-Based Analysis Essay.</p>
    </section>

    <section class="content blog-post" aria-labelledby="blog-title">
      <h2 id="blog-title">Blog: Generic Medication Failures</h2>

      <div class="image-gallery" aria-label="Blog images">
        <figure>
          <a href="4%20Patterns.jpg" target="_blank" rel="noopener" aria-label="Open 4 Patterns image in a larger view">
            <img src="4%20Patterns.jpg" alt="Four patterns" loading="lazy">
          </a>
          <figcaption class="image-caption">4 Patterns</figcaption>
        </figure>
        <figure>
          <a href="999%20My%20Patterns%20and%20Phenomenon%20Photo.jpg" target="_blank" rel="noopener" aria-label="Open My Patterns and Phenomenon Photo image in a larger view">
            <img src="999%20My%20Patterns%20and%20Phenomenon%20Photo.jpg" alt="My patterns and phenomenon photo" loading="lazy">
          </a>
          <figcaption class="image-caption">My Patterns and Phenomenon Photo</figcaption>
        </figure>
      </div>

      <p class="paragraph-space"></p>
      <p class="paragraph-space"></p>
      <p class="paragraph-space"></p>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 Zuzanna Koziatek</p>
  </footer>
</body>
</html>
