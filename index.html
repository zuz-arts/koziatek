<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zuzanna Koziatek | English Student at IU</title>
  <style>
    :root {
      --purple: #6d28d9;
      --dark-purple: #4c1d95;
      --light-purple: #f5f3ff;
      --text: #241b35;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      color: var(--text);
      font-family: Arial, sans-serif;
      line-height: 1.6;
    }

    header {
      background: linear-gradient(135deg, var(--purple), var(--dark-purple));
      color: white;
      padding: 1rem 8%;
    }

    nav {
      align-items: center;
      display: flex;
      justify-content: space-between;
      margin: 0 auto;
      max-width: 1100px;
    }

    .logo {
      font-size: 1.1rem;
      font-weight: bold;
      letter-spacing: 0.04em;
    }

    nav ul {
      display: flex;
      gap: 1.5rem;
      list-style: none;
    }

    nav a {
      color: white;
      text-decoration: none;
    }

    nav a:hover,
    nav a:focus {
      text-decoration: underline;
    }

    .hero {
      padding: 6rem 8%;
      text-align: center;
    }

    .hero h1 {
      font-size: clamp(2.5rem, 7vw, 4.5rem);
      margin-bottom: 0.5rem;
    }

    .hero p {
      font-size: clamp(1.1rem, 2vw, 1.4rem);
      opacity: 0.9;
    }

    main {
      background: var(--light-purple);
      min-height: 300px;
      padding: 4rem 8%;
    }

    .content {
      margin: 0 auto;
      max-width: 800px;
      text-align: center;
    }

    .content h2 {
      color: var(--dark-purple);
      margin-bottom: 1rem;
    }

    footer {
      background: var(--dark-purple);
      color: white;
      padding: 1rem;
      text-align: center;
    }
  </style>
</head>
<body>
  <header>
    <nav aria-label="Main navigation">
      <a class="logo" href="#about">Zuzanna Koziatek</a>
      <ul>
        <li><a href="#about">About</a></li>
        <li><a href="unit-1.html">Unit 1</a></li>
      </ul>
    </nav>

    <section class="hero" aria-labelledby="page-title">
      <h1 id="page-title">Zuzanna Koziatek</h1>
      <p>English Student at IU</p>
    </section>
  </header>

  <main id="about">
    <section class="content" aria-labelledby="about-title">
      <h2 id="about-title">About</h2>
      <p>Welcome to my personal website. I am an English student at IU, passionate about language, literature, and thoughtful communication.</p>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 Zuzanna Koziatek</p>
  </footer>
</body>
</html>
